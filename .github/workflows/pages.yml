# Build the project site and deploy it to GitHub Pages.
# The page and the build script are in projects/site/ on main; the viewers and pictures
# are on the site-data branch, at the commit pinned in projects/site/data.lock
# (projects/site/publish.sh updates both).
name: pages

on:
  push:
    branches: [main]
    paths: ["projects/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lock
        run: echo "sha=$(cat projects/site/data.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.lock.outputs.sha }}
          path: site-data
      - run: rm -rf site-data/.git && python3 projects/site/build.py build --data site-data --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
