[project]
name = "carvera-scan"
version = "0.1.0"
description = "3D-scan the Carvera's bed with a cross laser and two cameras: capture on kinsey, process on Buzzkill"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-contrib-python-headless",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
# Point-cloud cleaning (consistency, SOR, ICP) and the viewer's cloud filter. Buzzkill has it;
# the Mac does not need it to edit or to run the light steps.
process = ["open3d>=0.19"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carvera_scan"]
